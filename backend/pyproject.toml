[project]
name = "riskflow-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
 "catboost>=1.2.10", "interpret-core>=0.7.8", "numpy>=2.5.4",
 "pandas>=3", "sortedcontainers>=2.4.0", "threadpoolctl>=3",
]

[dependency-groups]
dev = [
 "pytest>=8,<10",
 "ruff>=0.11,<1",
 "mypy>=1.15,<2",
 "httpx2>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml", "model_artifacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["sortedcontainers.*", "catboost.*", "interpret.*", "sklearn.*", "threadpoolctl.*"]
ignore_missing_imports = true
