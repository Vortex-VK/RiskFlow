services:
  - type: web
    name: riskflow
    runtime: docker
    # Free hosting only. The full 10,000-payment workload is not verified at this size.
    plan: free
    numInstances: 1
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: RISKFLOW_PUBLIC_DEMO
        value: "true"
      - key: PORT
        value: "8000"
